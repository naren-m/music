name: Carnatic Music Learning Platform - CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: 3.9
  NODE_VERSION: 18
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: carnatic-music-app

jobs:
  # Security and Code Quality
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Python Backend Testing
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04  # 3.9 matches the Dockerfile; ubuntu-26.04 has no 3.9

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: carnatic_test
          POSTGRES_USER: carnatic_user
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # init_db.py needs psycopg2; requirements.txt keeps it commented out (optional in the image)
          pip install psycopg2-binary==2.9.7

      - name: Set up environment variables
        run: |
          echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
          echo "POSTGRES_PORT=5432" >> $GITHUB_ENV
          echo "POSTGRES_DB=carnatic_test" >> $GITHUB_ENV
          echo "POSTGRES_USER=carnatic_user" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=test_password" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "FLASK_ENV=testing" >> $GITHUB_ENV

      - name: Initialize test database
        run: |
          python migrations/init_db.py init --force

      # Coverage scope (core, api, modules), reports and the fail-under floor
      # all come from pytest.ini. The floor is a ratchet at the measured 41%,
      # not 80%: https://github.com/naren-m/music/issues/13
      - name: Run unit tests
        run: |
          pytest tests/ -v --junitxml=test-results.xml

      # "Run performance benchmarks" (python run_tests.py --benchmark) removed:
      # there are no benchmark tests and it names a missing test file.
      # Put it back with real tests: https://github.com/naren-m/music/issues/14

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: backend
          name: carnatic-backend-coverage

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            coverage_html/
            coverage.xml
            test-results.xml

  # Frontend Testing (when React setup is ready)
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: false  # Disable until React migration is complete

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run type-check

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: carnatic-frontend-coverage

  # End-to-End Testing
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-24.04  # 3.9 matches the Dockerfile; ubuntu-26.04 has no 3.9
    needs: [backend-tests]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: carnatic_test
          POSTGRES_USER: carnatic_user
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1-dev build-essential

      # Build the SPA the way the Dockerfile does, so Flask serves it
      # same-origin (SPA_DIST_DIR) and Socket.IO goes to window.location.origin.
      - name: Set up Node.js 20 (matches the Dockerfile frontend stage)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary==2.9.7 playwright==1.57.0 pytest-html==4.1.1

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Set up environment variables
        run: |
          echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
          echo "POSTGRES_PORT=5432" >> $GITHUB_ENV
          echo "POSTGRES_DB=carnatic_test" >> $GITHUB_ENV
          echo "POSTGRES_USER=carnatic_user" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=test_password" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "FLASK_ENV=testing" >> $GITHUB_ENV

      - name: Initialize test database
        run: |
          python migrations/init_db.py reset --force

      # app.py is the entry point (app_v2.py is gone). Outside development it
      # needs ALLOW_UNSAFE_WERKZEUG=1 for the threaded Socket.IO server, as in
      # the Docker image. Fail the step unless /api/v1/health answers.
      - name: Start application
        env:
          PORT: 5002
          SPA_DIST_DIR: ${{ github.workspace }}/frontend/dist
          ALLOW_UNSAFE_WERKZEUG: 1
        run: |
          # Throwaway per-run key: create_app refuses to start without one
          # outside development. Not a secret; it signs nothing that outlives the job.
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          nohup python app.py > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5002/api/v1/health && exit 0
            sleep 2
          done
          echo "app did not become healthy"; cat app.log; exit 1

      # Runs the maintained browser test: guest login -> Sarali exercise ->
      # synthetic mic -> Socket.IO pitch validation. -o addopts="" drops the
      # unit-tier coverage gate and the --ignore of tests/e2e from pytest.ini.
      # tests/test_e2e_playwright.py and tests/e2e/test_performance_validation.py
      # are not run: they target a UI that no longer exists.
      # https://github.com/naren-m/music/issues/19
      - name: Run Playwright tests
        env:
          E2E_FRONTEND_URL: http://localhost:5002/
        run: |
          pytest tests/e2e/test_sarali_live_practice.py -o addopts="" -v -s --html=e2e-report.html --self-contained-html

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            e2e-report.html
            app.log

  # Docker Build and Test
  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          # {{branch}} is empty on pull_request, which made the tag ":-<sha>"
          # (invalid). Push events keep the same tags as before; PRs get
          # pr-<n> and pr-<n>-<sha7>.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      # Pull requests build amd64 only and load it into the local daemon
      # (multi-arch images can't be loaded); nothing is pushed. Push events
      # build both arches and push, as before.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

      # Runs the image just built (loaded locally on PRs, pulled on push) and
      # checks: /api/v1/health returns {"status": "healthy"}, and / serves
      # the built React SPA (index.html with the #root mount point).
      - name: Test Docker image
        env:
          IMAGE: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          # Throwaway per-run key: create_app refuses to start without one
          # outside development. No --rm, so the logs survive a crash.
          docker run -d --name carnatic-test -e FLASK_ENV=testing \
            -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            -p 5001:5001 "$IMAGE"
          trap 'docker logs carnatic-test; docker rm -f carnatic-test' EXIT

          healthy=no
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5001/api/v1/health > health.json; then healthy=yes; break; fi
            sleep 2
          done
          [ "$healthy" = yes ] || { echo "container never answered /api/v1/health"; exit 1; }
          cat health.json
          python3 -c 'import json,sys; d=json.load(open("health.json")); sys.exit(d.get("status")!="healthy")'

          curl -fsS http://localhost:5001/ > index.html
          grep -q 'id="root"' index.html

  # Performance Testing
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Start application
        run: |
          docker run --rm -d --name carnatic-perf \
            -e FLASK_ENV=production \
            -p 5001:5001 \
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          sleep 30

      - name: Run performance tests
        run: |
          k6 run --out json=results.json tests/performance/load-test.js

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: results.json

      - name: Stop application
        run: docker stop carnatic-perf

  # Code Quality and Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-24.04  # 3.9 matches the Dockerfile; ubuntu-26.04 has no 3.9

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Pinned so a formatter release can't turn main red. black, flake8 and
      # mypy match requirements.txt. pylint was installed but never run.
      - name: Install analysis tools
        run: |
          pip install black==23.7.0 isort==6.1.0 flake8==6.0.0 mypy==1.5.1 bandit==1.8.6

      # black and isort read pyproject.toml (profile black, 127 columns).
      - name: Check code formatting
        run: |
          black --check --diff .
          isort --check-only --diff .

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Flags live in mypy.ini. It also lists the 22 modules that still have
      # errors (ignore_errors ratchet); every other file is checked for real:
      # https://github.com/naren-m/music/issues/15
      - name: Type checking with mypy
        run: |
          mypy .

      # Full report (all severities) goes to the artifact; the gate is
      # high severity, which must stay at zero.
      - name: Security analysis with bandit
        run: |
          bandit -r . -x ./tests -f json -o bandit-results.json --exit-zero
          bandit -r . -x ./tests -lll

      - name: Upload code quality results
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-results
          path: |
            bandit-results.json

  # Deployment to Staging (on develop branch)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-tests, e2e-tests, docker-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Image: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Add actual deployment commands here (Kubernetes, Docker Swarm, etc.)

      - name: Run staging smoke tests
        run: |
          echo "🧪 Running staging smoke tests..."
          # Add smoke test commands

      - name: Notify deployment status
        if: always()
        run: |
          echo "📢 Staging deployment completed"

  # Deployment to Production (on main branch with tags)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-tests, e2e-tests, docker-build, performance-tests]
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Tag: ${{ github.ref_name }}"
          echo "Image: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Add actual deployment commands here

      - name: Run production smoke tests
        run: |
          echo "🧪 Running production smoke tests..."
          # Add smoke test commands

      - name: Create deployment notification
        run: |
          echo "📢 Production deployment successful!"
          echo "Version: ${{ github.ref_name }}"

  # Cleanup
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [backend-tests, e2e-tests, docker-build]
    if: always()

    steps:
      - name: Clean up container registry
        run: |
          echo "🧹 Cleaning up old container images..."
          # Add cleanup commands for old images