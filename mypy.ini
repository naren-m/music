[mypy]
# Shared by CI (Code Quality job) and local `mypy .`.
python_version = 3.9
ignore_missing_imports = True
follow_imports = skip
# Two modules are named patterns.py (alankaram, janta); map paths to dotted names.
explicit_package_bases = True

# Ratchet: these modules had errors when the gate first ran (204 in 22 files).
# Fix one, delete its section. Never add a new one.
# https://github.com/naren-m/music/issues/15

